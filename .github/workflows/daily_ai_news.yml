name: "Daily Autonomous AI News Publisher (ainews.krishnavibez.in)"

'on':
  schedule:
    # Hourly Publishing: Runs at minute 15 of every hour (avoids GitHub 00:00 queue delay)
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: daily-ai-news-publisher
  cancel-in-progress: false

jobs:
  publish-ai-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pillow

      - name: Generate Trending AI News Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u daily_ai_news_engine.py

      - name: Commit & Push Generated News to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AINews Autonomous Reporter"
          git add public/articles/*.html public/index.html public/sitemap.xml public/news-sitemap.xml public/rss.xml public/api/articles.json ai_news_history.json
          git commit -m "feat(ai-news): publish breaking AI news report & update sitemaps [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD || true

      - name: Set up Node.js for Firebase
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: "Deploy to Firebase Hosting (Site: ainews-krishnavibez)"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools
            firebase deploy --only hosting:ainews-krishnavibez --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_TOKEN not set, deploy handled by deploy-hosting workflow."
          fi
